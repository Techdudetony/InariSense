name: inarisense
description: "InariSense — a location-aware, explainable garden companion app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  camera: ^0.12.0+2
  path_provider: ^2.1.4
  flutter_local_notifications: ^22.2.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
